services:
  secret:
    image: ghcr.io/largerio/secret:1.8.1
    restart: unless-stopped
    volumes:
      # The database, the encrypted files and the server's key, generated on
      # the first start: back up this folder whole.
      - ${APP_DATA_DIR}/data:/app/data
    environment:
      # Its domain when exposed; otherwise Runtipi sets no APP_DOMAIN, and the
      # app is reached on the host's port.
      - APP_URL=${APP_PROTOCOL:-http}://${APP_DOMAIN:-${APP_HOST}:${APP_PORT}}
      # Runtipi's Traefik sits in front of the app: rate limits tell visitors
      # apart by the address it forwards.
      - ADDRESS_HEADER=X-Forwarded-For
      - XFF_DEPTH=1
    depends_on:
      secret-init:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    x-runtipi:
      is_main: true
      internal_port: 3000
  # The app runs as uid 1001 and the data folder is created by root: hand it
  # over before the app starts.
  secret-init:
    image: ghcr.io/largerio/secret:1.8.1
    # Runs once. Runtipi gives a service without a policy "unless-stopped",
    # which would restart it forever and keep the app waiting. Quoted: a
    # bare no is a boolean in YAML.
    restart: "no"
    user: "0:0"
    entrypoint: ["chown", "-R", "1001:1001", "/app/data"]
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
x-runtipi:
  schema_version: 2
